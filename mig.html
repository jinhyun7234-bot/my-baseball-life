<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>커리어 옮기기 · 나의 야구 인생</title>
<style>
html,body{margin:0;height:100%;background:#08111f;color:#e8eef8;font-family:Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
.c{max-width:360px;width:100%;word-break:keep-all;overflow-wrap:break-word}b{font-size:20px}p{color:#a9b6cc;line-height:1.6;font-size:15px}
.bar{height:6px;border-radius:3px;background:#1d2840;overflow:hidden;margin:4px auto 0;max-width:240px}.bar i{display:block;height:100%;width:0;background:#3182f6}
a{display:none;margin-top:12px;padding:12px 18px;border-radius:12px;background:#3182f6;color:#fff;text-decoration:none;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w"><div class="c"><b id="t">커리어 옮기는 중…</b><p id="s">잠시만 기다려 주세요.</p><div class="bar" id="bar" hidden><i id="barv"></i></div><a id="go" href="/">게임 열기</a></div></div>
<script>
/* v857t 커리어 옮기기 — 두 주소에 같은 파일이 올라감
   · 새 주소(my-baseball-life.com): 받는 쪽 — 예전 주소에서 온 데이터만 받아(새 창은 보낸 곳 확인, 같은 창은 어디서 왔는지 확인) 이 주소 저장 공간에 합침
     새 주소에 아무것도 없으면 그대로 복사 · 이미 하던 게 있으면 합침(슬롯 목록 합치기 · 같은 슬롯은 더 최근 것 · 설정은 새 주소 것 유지) · 중간에 실패하면 되돌림
   · 예전 주소(my-baseball-life.pages.dev): 보내는 쪽 — 나눠 보내는 다음 조각 넘기기 · 다 끝나면 '옮김 끝' 표시 남기고 새 주소로 */
(function(){
var OLD='https://my-baseball-life.pages.dev',NEW='https://my-baseball-life.com',OH='my-baseball-life.pages.dev';
var T=document.getElementById('t'),S=document.getElementById('s'),G=document.getElementById('go'),BAR=document.getElementById('bar'),BV=document.getElementById('barv');
var h=location.hash.slice(1);if(h){try{history.replaceState(null,'',location.pathname)}catch(e){}}
var ss=null;try{ss=window.sessionStorage}catch(e){}
function show(t,s,btn,href){T.textContent=t;S.textContent=s||'';G.style.display=btn?'inline-block':'none';if(href)G.setAttribute('href',href);BAR.hidden=true}
function prog(i,n){T.textContent='커리어 옮기는 중…';S.textContent=n>1?(i+' / '+n):'잠시만 기다려 주세요.';G.style.display='none';if(n>1){BAR.hidden=false;BV.style.width=Math.round(i/n*100)+'%'}}
function safeBack(b){try{var u=new URL(b||'/',NEW);if(u.origin===NEW)return u.pathname+u.search}catch(e){}return'/'}
var m;
/* ───── 예전 주소: 보내는 쪽 ───── */
if(location.hostname===OH){
  var B=null;try{B=JSON.parse(ss.getItem('bb_mig_buf')||'null')}catch(e){}
  var fromNew=(document.referrer||'').indexOf(NEW+'/')===0;
  if((m=/^next=([a-z0-9]{4,24})\.(\d{1,4})$/.exec(h))){var i=+m[2];
    if(!B||B.id!==m[1]||!(i<B.n)){show('옮기지 못했어요','처음 화면에서 다시 눌러 주세요.',true,'/');return}
    prog(i,B.n);location.replace(NEW+'/mig#c='+B.id+'.'+i+'.'+B.n+'.'+B.s.slice(i*B.ch,(i+1)*B.ch));return}
  if((m=/^ok=([a-z0-9]{4,24})\.(.*)$/.exec(h))){var bk='/';try{bk=safeBack(decodeURIComponent(m[2]))}catch(e){}
    if(fromNew&&B&&B.id===m[1]){try{localStorage.setItem('bb_mig_com',String(Date.now()))}catch(e){}try{ss.removeItem('bb_mig_buf')}catch(e){}}
    show('다 옮겼어요','새 주소로 가는 중…');location.replace(NEW+bk);return}
  location.replace('/');return}
/* ───── 새 주소: 받는 쪽 ───── */
var GAME=/^bb_(slot_|slots_v1$|career_v2$)/,KEY=/^bb_[A-Za-z0-9_-]{1,60}$/,SID=/^[A-Za-z0-9_-]{1,40}$/;
var fromOld=(document.referrer||'').indexOf(OLD+'/')===0;
function str(v,n){return typeof v==='string'?v.slice(0,n):''}
function num(v){v=+v;return isFinite(v)?v:0}
function clean(e){var u=(e&&e.sum&&typeof e.sum==='object')?e.sum:{},o={id:String(e.id),name:str(e.name,60)||'커리어',upd:num(e.upd)||Date.now(),sum:{}};
  ['nm','team','st','pos'].forEach(function(k){if(typeof u[k]==='string')o.sum[k]=u[k].slice(0,40)});['y','ovr'].forEach(function(k){if(u[k]!=null&&isFinite(+u[k]))o.sum[k]=+u[k]});
  if(u.hof)o.sum.hof=true;if(u.ret)o.sum.ret=true;return o}
function merge(items){
  if(!items||typeof items!=='object')throw new Error('형식');
  var ls=window.localStorage,keys=Object.keys(items).filter(function(k){return KEY.test(k)&&!/^bb_mig/.test(k)&&typeof items[k]==='string'}),i,hasLocal=false,old={},cnt=0;
  for(i=0;i<ls.length;i++){if(GAME.test(ls.key(i))){hasLocal=true;break}}
  function put(k,v){if(!Object.prototype.hasOwnProperty.call(old,k))old[k]=ls.getItem(k);ls.setItem(k,v)}
  var im=null;try{im=JSON.parse(items['bb_slots_v1']||'null')}catch(e){}
  var seen={},inList=(im&&Array.isArray(im.list))?im.list.filter(function(e){if(!e||!SID.test(String(e.id))||seen[e.id]||typeof items['bb_slot_'+e.id]!=='string')return false;return seen[e.id]=true}):[];
  var lg=typeof items['bb_career_v2']==='string'?items['bb_career_v2']:null;
  try{
    if(!hasLocal){
      keys.forEach(function(k){if(k==='bb_slots_v1'||/^bb_slot_/.test(k))return;put(k,items[k])});
      inList.forEach(function(e){put('bb_slot_'+e.id,items['bb_slot_'+e.id])});
      if(inList.length){var act=(im.active&&seen[im.active])?im.active:inList[0].id;put('bb_slots_v1',JSON.stringify({active:act,list:inList.map(clean)}))}
      cnt=inList.length||(lg?1:0);return cnt}
    var lm=null;try{lm=JSON.parse(ls.getItem('bb_slots_v1')||'null')}catch(e){}
    if(!lm||!Array.isArray(lm.list))lm={active:null,list:[]};
    var by={};lm.list.forEach(function(x){if(x&&x.id!=null)by[x.id]=x});
    inList.forEach(function(e){var k='bb_slot_'+e.id,cur=ls.getItem(k),loc=by[e.id],c=clean(e);cnt++;
      if(!loc){if(cur!==items[k])put(k,items[k]);lm.list.push(c);by[e.id]=c;return}
      if(cur===null){put(k,items[k]);return}
      if(cur!==items[k]&&c.upd>num(loc.upd)){put(k,items[k]);loc.name=c.name;loc.upd=c.upd;loc.sum=c.sum}});
    if(lg&&!inList.length){var dup=false;for(i=0;i<ls.length;i++){var kk=ls.key(i);if(/^bb_slot_/.test(kk)&&ls.getItem(kk)===lg){dup=true;break}}
      if(!dup){var id='m'+Date.now().toString(36),nm='옮겨 온';try{nm=str(JSON.parse(lg).me.name,30)||nm}catch(e){}put('bb_slot_'+id,lg);lm.list.push({id:id,name:nm+'의 커리어',upd:Date.now(),sum:{nm:nm}})}cnt++}
    keys.forEach(function(k){if(GAME.test(k))return;if(ls.getItem(k)===null)put(k,items[k])});
    if(!(lm.active!=null&&by[lm.active]&&ls.getItem('bb_slot_'+lm.active)!==null)){
      lm.active=(im&&im.active&&by[im.active])?im.active:(lm.list.slice().sort(function(a,b){return num(b.upd)-num(a.upd)})[0]||{}).id||null}
    put('bb_slots_v1',JSON.stringify(lm));return cnt
  }catch(er){for(var k in old){try{if(old[k]===null)ls.removeItem(k);else ls.setItem(k,old[k])}catch(x){}}throw er}}
function why(er){return(er&&(er.name==='QuotaExceededError'||er.code===22||er.code===1014))?'quota':String(er&&er.name||er)}
function fail(er){var q=why(er)==='quota';
  show('옮기지 못했어요',q?'새 주소 저장 공간이 모자라요. 안 쓰는 커리어를 지우고 다시 해 주세요.':'예전 주소에서 다시 시도해 주세요.',true,OLD+'/')}
function done(n,bk){show('다 옮겼어요',n>0?('커리어 '+n+'개를 옮겼어요. 곧 게임이 열려요.'):'곧 게임이 열려요.',true,bk)}
function decode(s){var mode=s.charAt(0),b=s.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  if(mode==='z')return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text().then(JSON.parse);
  if(mode==='b')return Promise.resolve(JSON.parse(window.TextDecoder?new TextDecoder().decode(u):decodeURIComponent(escape(bin))));
  return Promise.reject(new Error('형식'))}
function clearRx(){try{var r=JSON.parse(ss.getItem('bb_mig_rx')||'null');if(r)for(var i=0;i<r.n;i++)ss.removeItem('bb_mig_p'+i);ss.removeItem('bb_mig_rx')}catch(e){}}
function land(s,id){prog(1,1);
  decode(s).then(function(d){var n=merge(d&&d.items),bk=safeBack(d&&d.back);done(n,bk);
    setTimeout(function(){location.replace(OLD+'/mig#ok='+id+'.'+encodeURIComponent(bk))},900)})['catch'](fail)}
if((m=/^c=([a-z0-9]{4,24})\.(\d{1,4})\.(\d{1,4})\.([A-Za-z0-9_-]*)$/.exec(h))){
  if(!fromOld){show('옮길 커리어가 없어요','바로 게임을 열 수 있어요.',true,'/');return}
  var id=m[1],i=+m[2],n=+m[3],part=m[4];
  if(!(n>=1&&n<=600&&i<n)){fail('범위');return}
  if(n===1){land(part,id);return}
  var meta=null;try{meta=JSON.parse(ss.getItem('bb_mig_rx')||'null')}catch(e){}
  if(i===0){clearRx();meta={id:id,n:n}}
  if(!meta||meta.id!==id||meta.n!==n){fail('순서');return}
  try{ss.setItem('bb_mig_rx',JSON.stringify(meta));ss.setItem('bb_mig_p'+i,part)}catch(e){clearRx();fail(e);return}
  if(i<n-1){prog(i+1,n);location.replace(OLD+'/mig#next='+id+'.'+(i+1));return}
  var all='';for(var k=0;k<n;k++){var p=ss.getItem('bb_mig_p'+k);if(p===null){clearRx();fail('빠짐');return}all+=p}
  clearRx();land(all,id);return}
if(window.opener){
  var got=false;
  window.addEventListener('message',function(e){
    if(e.origin!==OLD||!e.data||e.data.t!=='mig-data'||got)return;got=true;
    try{var n=merge(e.data.p&&e.data.p.items);e.source.postMessage({t:'mig-done'},OLD);
      show('다 옮겼어요',(n>0?'커리어 '+n+'개를 옮겼어요. ':'')+'원래 창에서 새 주소로 넘어가요.',true,'/');
      setTimeout(function(){try{window.close()}catch(x){}setTimeout(function(){location.replace('/')},600)},700)}
    catch(er){try{e.source.postMessage({t:'mig-fail',why:why(er)},OLD)}catch(x){}fail(er)}});
  var tries=0;(function ping(){if(got)return;if(tries++>60){show('원래 창으로 돌아가 주세요','원래 창에서 이어서 옮겨져요.',false);return}
    try{window.opener.postMessage({t:'mig-ready'},OLD)}catch(e){}setTimeout(ping,250)})();
}else show('옮길 커리어가 없어요','바로 게임을 열 수 있어요.',true,'/');
})();
</script>
</body>
</html>
